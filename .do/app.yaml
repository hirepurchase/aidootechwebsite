# DigitalOcean App Platform — Static Site spec.
#
# Apply with:  doctl apps create --spec .do/app.yaml
# Or create the app in the control panel, where DigitalOcean detects the
# Next.js project and you only need to confirm the values marked below.
name: aidootechwebsite
region: fra # Frankfurt — closest DO region to Ghana. ams or lon also fine.

static_sites:
  - name: web
    environment_slug: node-js

    github:
      repo: hirepurchase/aidootechwebsite
      branch: main
      deploy_on_push: true

    build_command: npm run build
    output_dir: out # `next build` writes the exported site here
    index_document: index.html
    error_document: 404.html

    routes:
      - path: /
